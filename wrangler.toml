name = "flaxia"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[durable_objects.bindings]]
name = "NOTIFICATION_STREAM"
class_name = "NotificationStream"
script_name = "notif-stream"

[[durable_objects.bindings]]
name = "CALL_STREAM"
class_name = "CallStream"
script_name = "notif-stream"

[[durable_objects.bindings]]
name = "MULTIPLAYER_ROOM"
class_name = "MultiplayerRoom"
script_name = "multiplayer-worker"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"
script_name = "multiplayer-worker"

[[d1_databases]]
binding = "DB"
database_name = "flaxia"
database_id = "7c99f35f-69a0-4644-96a1-34c716a3e82d"

[vars]
SANDBOX_ORIGIN = "https://flaxia.app"
BASE_URL = "https://flaxia.app"
CROWD_ORCHESTRATOR_URL = "https://crowd.flaxia.app"
ADMIN_USERNAMES = "remydrescarlet"

# To set CROWD_API_KEY secret:
#   npx wrangler secret put CROWD_API_KEY

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "flaxia-content"

[[kv_namespaces]]
binding = "CACHE"
id = "c78f7711cd9d45738678474d884734c1"

[[queues.producers]]
queue = "activitypub-delivery"
binding = "AP_DELIVERY_QUEUE"

# Flaxia Crowd 分散コンピューティング
# CROWD_API_KEY は本番環境では secret 推奨:
#   npx wrangler secret put CROWD_API_KEY  -- エンタープライズ or 適切なAPIキー
#   npx wrangler pages secret put CROWD_API_KEY --project-name flaxia
# ※ 未設定の間は NSFW 画像スクリーニング・embeddings の submit がスキップされる
#    (submitDetectNsfw / embedPost が apiKey なしで早期 return)。
#    CROWD_ORCHESTRATOR_URL は上記 [vars] の https://crowd.flaxia.app を使用。
# スクリーニング進行状況は post_nsfw_scans テーブル (migration 0063) に記録。
# 既存画像投稿の再スキャンは admin 専用 API:
#   curl -X POST https://flaxia.app/api/admin/backfill-nsfw?limit=50  (要 admin セッション)

# FCM (Firebase Cloud Messaging) — Capacitor モバイルアプリ向けプッシュ通知
# Firebase Console → プロジェクトの設定 → サービスアカウント → 新しい秘密鍵を生成
# ダウンロードされた JSON ファイルの内容全体を secret に設定:
#   npx wrangler secret put FCM_SERVER_KEY
# またはローカル開発用に .dev.vars に保存:
#   echo "FCM_SERVER_KEY=$(cat service-account.json)" > .dev.vars

# Web Push (VAPID)
# 本番環境では下記の secret を設定:
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
# 開発環境では自動生成される（毎回変わるので通知が切れる可能性あり）

# Media Signing (HMAC署名URL)
# メディアURLの署名・検証に使用するシークレット:
#   npx wrangler secret put MEDIA_SIGNING_SECRET
#   npx wrangler pages secret put MEDIA_SIGNING_SECRET --project-name flaxia
# 開発環境では .dev.vars に MEDIA_SIGNING_SECRET=your-secret-key を設定

[[vectorize]]
binding = "VECTORIZE"
index_name = "flaxia-posts"