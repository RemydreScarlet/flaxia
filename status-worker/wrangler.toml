name = "flaxia-status"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "status.flaxia.app/*", zone_name = "flaxia.app" }
]

[triggers]
crons = ["*/1 * * * *"]

# Static status page (index.html / styles.css / app.js)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

# D1 database for check state, history, incidents
# 事前に作成:
#   npx wrangler d1 create flaxia-status
# で得た database_id を以下に設定する。
[[d1_databases]]
binding = "DB"
database_name = "flaxia-status"
database_id = "deda1482-d5f0-44a1-a120-e6fb9b31c269"

[vars]
BASE_URL = "https://flaxia.app"
SANDBOX_URL = "https://sandbox.flaxia.app"
CROWD_ORCHESTRATOR_URL = "https://crowd.flaxia.app"
STATUS_TEST_USERNAME = "devstatus"

# Secrets (wrangler secret put):
#   CROWD_API_KEY           — flaxia-crowd オーケストレーターの API キー
#   STATUS_TEST_EMAIL       — ログイン検証用テストアカウントのメール
#   STATUS_TEST_PASSWORD    — ログイン検証用テストアカウントのパスワード